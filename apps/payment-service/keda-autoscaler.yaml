apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-queue-scaler
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://cluster.local
      metricName: http_requests_total
      query: sum(rate(http_requests_total{job="payment-service"}[2m]))
      threshold: '150'
